#:schema https://mise.jdx.dev/schema/mise.json

# mise 内蔵の brew バックエンドで導入するシステムパッケージ（Homebrew 本体は不要）
# 導入: mise bootstrap packages apply / 更新: mise bootstrap packages upgrade
[bootstrap.packages]
"brew:git" = "latest"

[plugins]
meltype = "~/.config/mise/plugins/meltype"

[tools]
bun = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
lefthook = "latest"
node = "latest"
pnpm = "latest"
shfmt = "latest"
starship = "latest"
"npm:difit" = "latest"
rust = "latest"
helix = "latest"
yazi = "latest"
"github:trasta298/keifu" = "latest"
"github:laishulu/macism" = { version = "latest", os = ["macos"] }
"github:jfernandez/mdserve" = { version = "latest", bin = "mdserve" }
colima = "latest"
docker-cli = "latest"
lima = "latest"
gcloud = "latest"
docker-compose = "latest"
"github:k1LoW/mo" = "latest"
claude-code = "latest"
codex = "latest"
ni = "latest"
herdr = "latest"
# mise-versions.jdx.dev のミラーは公開直後の版を持たない。api_url が "https://api.github.com" と文字列一致するときだけミラーを使うので、:443 を付けて外す
"github:miyaoka/gozd" = { version = "latest", prerelease = "true", api_url = "https://api.github.com:443", postinstall = '"$MISE_TOOL_INSTALL_PATH/bin/gozd" sync-app' }
"github:yusukebe/ax" = "latest"
meltype = { version = "latest", os = ["macos/arm64"] }
1password = "latest"
"packslip:github.com/miyaoka/tugime" = { version = "latest", workflow = "release.yml@refs/heads/main", postinstall = '"$MISE_TOOL_INSTALL_PATH/install.sh" "$MISE_TOOL_INSTALL_PATH/tugime.app"' }

[settings]
trusted_config_paths = [
  '~/ghq/github.com/miyaoka/',
  '~/ghq/github.com/studio-design/',
  '~/worktrees/github.com/miyaoka',
  '~/worktrees/github.com/studio-design/',
  '~/.local/share/gozd/',
]
idiomatic_version_file_enable_tools = []
lockfile_platforms = ["macos-arm64"]
# 2026.10.19 で既定になった generate は、lockfile_platforms が現在のプラットフォームだけのとき、npm: のツールの install が "missing lockfile entry" で失敗する
lockfile_mode = "merge"
minimum_release_age_excludes = ["claude-code", "github:miyaoka/gozd", "packslip:github.com/miyaoka/tugime"]
